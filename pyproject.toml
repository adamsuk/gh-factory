# Development metadata only. Users install with `gh extension install adamsuk/gh-factory`
# and need nothing but python3 (3.10+): PyYAML is vendored in src/factory/_vendor.
[project]
name = "gh-factory"
version = "0.5.1"
description = "gh CLI extension: apply a standard baseline to every repo carrying a topic"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["src/factory/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
