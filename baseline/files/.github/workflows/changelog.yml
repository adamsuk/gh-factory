name: Changelog

# Fails a pull request that does not update CHANGELOG.md, unless it has the skip-changelog label.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  changelog:
    uses: {{workflows_repo}}/.github/workflows/changelog.yml@{{workflows_ref}}
