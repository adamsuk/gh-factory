# Standard labels. Created or updated by name; other labels are never deleted.
- name: skip-changelog
  color: "ededed"
  description: Skips the CHANGELOG.md check for this pull request
- name: cutting edge
  color: "5319e7"
  description: Newer idea, not yet established best practice
- name: dependencies
  color: "0366d6"
  description: Dependency updates
- name: github_actions
  color: "000000"
  description: GitHub Actions updates
- name: factory
  color: "1d76db"
  description: Opened by adamsuk/factory
- name: bug
  color: "d73a4a"
  description: Something isn't working
- name: enhancement
  color: "a2eeef"
  description: New feature or request
- name: documentation
  color: "0075ca"
  description: Improvements or additions to documentation
