# Standard labels. Created or updated by name; other labels are never deleted.
- name: skip-changelog
  color: "ededed"
  description: Skips the CHANGELOG.md check for this pull request
- name: cutting edge
  color: "5319e7"
  description: Newer idea, not yet established best practice
- name: dependencies
  color: "0366d6"
  description: Dependency updates
- name: github_actions
  color: "000000"
  description: GitHub Actions updates
- name: factory
  color: "1d76db"
  description: Opened by gh-factory, or an issue queued for the factory agents
# Station status. Blues through greens follow the flow; blocked is red.
- name: "factory:triage"
  color: "b6e3ff"
  description: "01 Backlog: new issue waiting for triage"
- name: "factory:ready"
  color: "218bff"
  description: "01 Backlog: triaged; single target repo, checkable acceptance criteria, sized"
- name: "factory:building"
  color: "0550ae"
  description: "03 Bench: a builder is working on it"
- name: "factory:gate"
  color: "0e7c86"
  description: "04 Gate: PR open, waiting on required checks"
- name: "factory:review"
  color: "2da44e"
  description: "05 Review: checks green, waiting on review"
- name: "factory:merge"
  color: "1a7f37"
  description: "05 Review: approved, waiting to merge"
- name: "factory:release"
  color: "116329"
  description: "07 Release: merged, waiting to ship"
- name: "factory:done"
  color: "044f1e"
  description: "09 Return: shipped and closed out"
- name: "factory:blocked"
  color: "b60205"
  description: "Any station: needs a person; see the latest comment"
- name: bug
  color: "d73a4a"
  description: Something isn't working
- name: enhancement
  color: "a2eeef"
  description: New feature or request
- name: documentation
  color: "0075ca"
  description: Improvements or additions to documentation
