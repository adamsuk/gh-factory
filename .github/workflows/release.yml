name: Release

# Automatic semver releases from Conventional Commit titles, with a hand-written CHANGELOG.
# Generic and reusable: a repo calls it on every push to its default branch, e.g.
#   on:
#     push:
#       branches: [main]
#   jobs:
#     release:
#       permissions:
#         contents: write
#         pull-requests: write
#         id-token: write
#         attestations: write
#       uses: adamsuk/gh-factory/.github/workflows/release.yml@<commit-sha> # vX.Y.Z
#       with:
#         version_files: pyproject.toml src/pkg/__init__.py
#
# How it works (only the default GITHUB_TOKEN is used, no PAT or GitHub App):
# 1. After a feat, fix, perf or breaking (`!` / `BREAKING CHANGE:`) commit lands, it works out the
#    next version from every commit since the last tag (major > minor > patch; chore, docs, ci,
#    test and the rest release nothing) and opens or refreshes one release PR,
#    `chore(release): vX.Y.Z`. That PR moves everything under `## [Unreleased]` in the changelog
#    under a new `## [X.Y.Z] - YYYY-MM-DD` heading (each entry's headings drop one level) and bumps
#    the version string in `version_files`.
# 2. When that release PR is merged, it tags the merge commit and publishes a GitHub release whose
#    notes are that version's changelog section.
# The release commit goes through a PR because rulesets block direct pushes to main, and adding
# GitHub Actions as a bypass actor would weaken them. GitHub does not start workflows for a PR the
# GITHUB_TOKEN opens, so close and reopen the release PR (or push to it) to run its checks.
# The repo setting "Allow GitHub Actions to create and approve pull requests" must be on.
# 3. Each release also gets a source archive of the released commit, `<repo>-<tag>-source.tar.gz`,
#    with a build provenance attestation. A called workflow can only keep or reduce the permissions
#    its caller grants, never raise them, so the calling job must itself grant `id-token: write` and
#    `attestations: write` (as in the example above). Artifact attestations also need a GitHub plan
#    that supports them (public repos on any plan; private repos need GitHub Enterprise Cloud, see
#    GitHub's "Using artifact attestations" docs). The attest step has `continue-on-error: true`, so
#    a caller missing the permissions or the plan still gets its release and archive, but the
#    attestation is silently skipped (look for the warning on that step) rather than turning the
#    run red after the release has already shipped. The archive upload is not best effort.
on:
  workflow_call:
    inputs:
      changelog_file:
        type: string
        default: CHANGELOG.md
      version_files:
        description: Space-separated files whose quoted version string (on a line mentioning "version") is bumped
        type: string
        default: ""
      tag_prefix:
        type: string
        default: v
      release_branch:
        type: string
        default: release/next
      initial_version:
        description: Version to bump from when there is no release tag yet
        type: string
        default: 0.0.0

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Release, or open or refresh the release PR
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGELOG_FILE: ${{ inputs.changelog_file }}
          VERSION_FILES: ${{ inputs.version_files }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          RELEASE_BRANCH: ${{ inputs.release_branch }}
          INITIAL_VERSION: ${{ inputs.initial_version }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import datetime
          import os
          import re
          import subprocess
          import tempfile

          SEMVER = r"(\d+)\.(\d+)\.(\d+)"
          LEVELS = {None: 0, "patch": 1, "minor": 2, "major": 3}


          def run(*args, check=True):
              return subprocess.run(args, check=check, text=True, capture_output=True).stdout.strip()


          def classify(subject, body=""):
              """Release level for one commit: major, minor, patch or None."""
              m = re.match(r"^(\w+)(\([^)]*\))?(!)?: \S", subject)
              if not m:
                  return None
              kind, bang = m.group(1).lower(), m.group(3)
              if kind == "chore" and (m.group(2) or "").lower() == "(release)":
                  return None
              if bang or re.search(r"^BREAKING[ -]CHANGE: ", body, re.M):
                  return "major"
              if kind == "feat":
                  return "minor"
              if kind in ("fix", "perf"):
                  return "patch"
              return None


          def bump(version, level):
              major, minor, patch = (int(x) for x in re.fullmatch(SEMVER, version).groups())
              if level == "major":
                  return f"{major + 1}.0.0"
              if level == "minor":
                  return f"{major}.{minor + 1}.0"
              return f"{major}.{minor}.{patch + 1}"


          def _relevel(block):
              """Re-level moved entries to the house levels under `## [X.Y.Z]`.

              Each dated entry heading (`YYYY-MM-DD ...`) becomes `###` and the headings under it keep
              their relative depth starting at `####`, however deep the entry was written under
              Unreleased (house style is `## YYYY-MM-DD (topic)` with `### Added`). Headings before the
              first dated entry are shifted so the shallowest is `###`. Fenced code is left alone.
              """
              lines = block.splitlines()
              fence, heads = "", []  # fence is the open marker; heads are (index, level, is_dated)
              for i, line in enumerate(lines):
                  f = re.match(r"^ {0,3}(`{3,}|~{3,})(.*)$", line)
                  if f and not fence and not (f.group(1)[0] == "`" and "`" in f.group(2)):
                      fence = f.group(1)
                      continue
                  if f and fence and f.group(1)[0] == fence[0] and len(f.group(1)) >= len(fence) and not f.group(2).strip():
                      fence = ""
                      continue
                  h = None if fence else re.match(r"^(#{1,6}) +(.*)$", line)
                  if h:
                      heads.append((i, len(h.group(1)), bool(re.match(r"\d{4}-\d{2}-\d{2}\b", h.group(2)))))
              groups, current = [], []  # runs of headings, each starting at a dated heading
              for head in heads:
                  if head[2] and current:
                      groups.append(current)
                      current = []
                  current.append(head)
              if current:
                  groups.append(current)
              for group in groups:
                  if group[0][2]:
                      targets = {group[0][0]: 3}
                      subs = group[1:]
                      top = min((lvl for _, lvl, _ in subs), default=0)
                      targets.update({i: 4 + lvl - top for i, lvl, _ in subs})
                  else:
                      top = min(lvl for _, lvl, _ in group)
                      targets = {i: 3 + lvl - top for i, lvl, _ in group}
                  for i, level in targets.items():
                      lines[i] = "#" * min(level, 6) + " " + lines[i].lstrip("#").lstrip()
              return "\n".join(lines)


          def cut_release(text, version, date):
              """Move the Unreleased entries under a new version heading. Returns (text, notes)."""
              m = re.search(r"^## \[Unreleased\][^\n]*\n", text, re.M | re.I)
              if not m:
                  raise SystemExit("::error::No '## [Unreleased]' heading in the changelog.")
              rest = text[m.end():]
              nxt = re.search(r"^## \[", rest, re.M)
              block, tail = (rest[: nxt.start()], rest[nxt.start():]) if nxt else (rest, "")
              notes = _relevel(block.strip("\n")) or "No changelog entries."
              new = f"{text[: m.end()]}\n## [{version}] - {date}\n\n{notes}\n\n{tail}"
              return new.rstrip("\n") + "\n", notes


          def section(text, version):
              """The notes under '## [version]', for the GitHub release."""
              m = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.M | re.S)
              return m.group(1).strip() if m else None


          def bump_files(paths, old, new):
              for path in paths:
                  with open(path) as f:
                      text = f.read()
                  pattern = re.compile(rf"^(.*version.*)([\"']){re.escape(old)}\2", re.M | re.I)
                  text, n = pattern.subn(lambda m: f"{m.group(1)}{m.group(2)}{new}{m.group(2)}", text)
                  if not n:
                      raise SystemExit(f"::error::No version string {old!r} found in {path}.")
                  with open(path, "w") as f:
                      f.write(text)


          def main():
              env = os.environ
              changelog, prefix = env["CHANGELOG_FILE"], env["TAG_PREFIX"]
              branch, base = env["RELEASE_BRANCH"], env["BASE_BRANCH"]
              sha = run("git", "rev-parse", "HEAD")
              subject = run("git", "log", "-1", "--format=%s")

              m = re.match(rf"^chore\(release\): {re.escape(prefix)}({SEMVER})(?: \(#\d+\))?$", subject)
              if m:
                  version = m.group(1)
                  tag = prefix + version
                  if run("git", "tag", "--list", tag):
                      print(f"{tag} already exists; nothing to create.")
                      # Still expose the tag so a rerun after a partial failure (release made, archive
                      # or attestation not) can redo those steps; both are safe to repeat.
                      if env.get("GITHUB_OUTPUT"):
                          with open(env["GITHUB_OUTPUT"], "a") as out:
                              out.write(f"tag={tag}\n")
                      return
                  with open(changelog) as f:
                      notes = section(f.read(), version)
                  if notes is None:
                      raise SystemExit(f"::error::{changelog} has no '## [{version}]' section.")
                  with tempfile.NamedTemporaryFile("w", suffix=".md", delete=False) as f:
                      f.write(notes + "\n")
                  run("gh", "release", "create", tag, "--target", sha, "--title", tag, "--notes-file", f.name)
                  print(f"Released {tag}.")
                  if env.get("GITHUB_OUTPUT"):
                      with open(env["GITHUB_OUTPUT"], "a") as out:
                          out.write(f"tag={tag}\n")
                  return

              tags = [t for t in run("git", "tag", "--list", f"{prefix}*", "--sort=-v:refname").splitlines()
                      if re.fullmatch(re.escape(prefix) + SEMVER, t)]
              last = tags[0] if tags else None
              current = last[len(prefix):] if last else env["INITIAL_VERSION"]
              log = run("git", "log", "--format=%s%x00%b%x1e", f"{last}..HEAD" if last else "HEAD")
              level = None
              for entry in filter(None, (e.strip("\n") for e in log.split("\x1e"))):
                  s, _, b = entry.partition("\x00")
                  got = classify(s, b)
                  if LEVELS[got] > LEVELS[level]:
                      level = got
              if level is None:
                  print(f"No feat, fix, perf or breaking commits since {last or 'the start'}; no release.")
                  return
              version = bump(current, level)
              tag = prefix + version
              today = datetime.datetime.now(datetime.timezone.utc).date().isoformat()

              run("git", "checkout", "-B", branch)
              with open(changelog) as f:
                  text, notes = cut_release(f.read(), version, today)
              with open(changelog, "w") as f:
                  f.write(text)
              files = env["VERSION_FILES"].split()
              bump_files(files, current, version)
              run("git", "-c", "user.name=github-actions[bot]",
                  "-c", "user.email=41898282+github-actions[bot]@users.noreply.github.com",
                  "commit", "-m", f"chore(release): {tag}", "--", changelog, *files)
              run("git", "push", "--force", "origin", f"HEAD:refs/heads/{branch}")

              title = f"chore(release): {tag}"
              body = (f"Release {tag} ({level} bump from {last or current}).\n\n"
                      f"Merging this PR moves the `## [Unreleased]` entries in `{changelog}` under "
                      f"`## [{version}]`, then the release workflow tags the merge commit `{tag}` and "
                      "publishes a GitHub release with these notes. It is refreshed after every "
                      "releasable merge.\n\n"
                      "Checks do not start on a PR opened by GitHub Actions: close and reopen this PR "
                      "to run them, then squash-merge it with this title.\n\n"
                      f"---\n\n{notes}\n")
              existing = run("gh", "pr", "list", "--head", branch, "--base", base, "--state", "open",
                             "--json", "number", "--jq", ".[0].number")
              if existing:
                  run("gh", "pr", "edit", existing, "--title", title, "--body", body)
                  print(f"Refreshed release PR #{existing} for {tag}.")
              else:
                  print(run("gh", "pr", "create", "--head", branch, "--base", base,
                            "--title", title, "--body", body))


          if __name__ == "__main__":
              main()
          PY
      # Only when the step above created a release: attach a source archive of the released commit
      # and attest it. Nothing here depends on what the calling repo builds or deploys.
      - name: Archive the released commit
        id: archive
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          # Same commit, same bytes: git archive stamps entries with the commit time and the
          # built-in gzip writes no name or timestamp.
          # A tag_prefix like `release/v` puts a slash in the tag: flatten it for file and directory
          # names only; the real $TAG is still used for the release upload.
          name="${GITHUB_REPOSITORY#*/}-${TAG//\//-}"
          path="${RUNNER_TEMP}/${name}-source.tar.gz"
          git archive --format=tar.gz --prefix="${name}/" -o "$path" HEAD
          # --clobber makes a rerun replace the asset instead of failing because it already exists.
          gh release upload "$TAG" "$path" --clobber
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Attest the source archive
        if: steps.release.outputs.tag != ''
        # Best effort: a caller that has not granted id-token/attestations, or whose plan has no
        # artifact attestations, still gets its release and archive; only the attestation is skipped.
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.archive.outputs.path }}
