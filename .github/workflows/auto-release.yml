name: Auto release

# gh-factory's own releases: see release.yml for how the reusable workflow decides and releases.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/release.yml
    with:
      version_files: pyproject.toml src/factory/__init__.py
