name: Factory sync

# Applies the baseline to every repo carrying the `factory` topic.
# schedule and push to main apply; pull_request is always a dry run; manual runs default to a dry run.
on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "baseline/**"
      - "src/**"
      - "factory.yml"
      - ".github/workflows/sync.yml"
  pull_request:
    paths:
      - "baseline/**"
      - "src/**"
      - "factory.yml"
      - ".github/workflows/sync.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan only, change nothing"
        type: boolean
        default: true
      repo:
        description: "Limit to one enrolled repo (owner/name). Blank for all."
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: factory-sync-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      owners: ${{ steps.cfg.outputs.owners }}
      has_app: ${{ steps.cfg.outputs.has_app }}
      dry_run: ${{ steps.cfg.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
      - id: cfg
        env:
          APP_ID: ${{ secrets.FACTORY_APP_ID }}
          APP_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          EVENT: ${{ github.event_name }}
          DRY_INPUT: ${{ inputs.dry_run }}
          ONLY: ${{ inputs.repo }}
        run: |
          owners=$(yq -o=json -I=0 '.owners' factory.yml)
          if [ -n "$ONLY" ]; then
            owner="${ONLY%%/*}"
            owners=$(jq -c --arg o "$owner" '[.[] | select(ascii_downcase == ($o | ascii_downcase))]' <<< "$owners")
          fi
          echo "owners=$owners" >> "$GITHUB_OUTPUT"
          case "$EVENT" in
            pull_request) dry=true ;;
            workflow_dispatch) dry="${DRY_INPUT:-true}" ;;
            *) dry=false ;;
          esac
          echo "dry_run=$dry" >> "$GITHUB_OUTPUT"
          if [ -n "$APP_ID" ] && [ -n "$APP_KEY" ]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
            msg="Skipped: the FACTORY_APP_ID and FACTORY_APP_PRIVATE_KEY secrets are not set. See README.md, 'One-time GitHub App setup'."
            echo "::notice title=Factory sync skipped::$msg"
            echo "### Factory sync skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi

  sync:
    needs: setup
    if: needs.setup.outputs.has_app == 'true' && needs.setup.outputs.owners != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        owner: ${{ fromJSON(needs.setup.outputs.owners) }}
    name: sync (${{ matrix.owner }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install .
      # One installation token per owner. Fails clearly if the App is not installed there.
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
      - name: Plan${{ needs.setup.outputs.dry_run == 'false' && ' and apply' || ' (dry run)' }}
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ matrix.owner }}
          ONLY: ${{ inputs.repo }}
          DRY: ${{ needs.setup.outputs.dry_run }}
        run: |
          args=(--owner "$OWNER" --summary "$GITHUB_STEP_SUMMARY" --json plan.json)
          [ -n "$ONLY" ] && args+=(--repo "$ONLY")
          [ "$DRY" = "false" ] && args+=(--apply)
          python -m factory "${args[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: plan-${{ matrix.owner }}
          path: plan.json
          if-no-files-found: ignore
