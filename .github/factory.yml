# gh-factory's own overrides (see README.md, "Per-repo overrides").
skip:
  # .github/workflows/changelog.yml here is the reusable `workflow_call` source that every
  # enrolled repo calls. The baseline would replace it with a caller of itself, so it is
  # owned by this repo instead. It still checks this repo's own PRs via its pull_request trigger.
  - changelog-check

# Check runs that already run on every PR here (names taken from recent runs, never invented).
# With at least one required check, the factory also turns auto-merge on.
required_checks:
  - Test and lint (Python 3.10)
  - Test and lint (Python 3.13)
  - Extension runs with bare python3
  - Lint workflows
  - changelog
  - Analyze (actions)
  - Analyze (python)
  - PR title

# Factory agents (see README.md, "Agents"). Scott approved agent merges here on 2026-10-25.
# Agents still merge only when the required checks above are green. Roles stay the default
# (builder, reviewer) and the issue label stays `factory`.
agents:
  merge: true
