version: 2
updates:
  - package-ecosystem: pip
    directories: ["/"]
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directories: ["/"]
    schedule:
      interval: weekly
    labels: [dependencies, github_actions]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
