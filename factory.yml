# Factory configuration. See README.md.
# Accounts searched for repos carrying the enrolment topic.
owners:
  - touchlineHQ
  - adamsuk

# Add this GitHub topic to a repo to enrol it.
topic: factory

# Defaults applied to every enrolled repo. A repo can override these in its
# own .github/factory.yml (see README.md).
defaults:
  # Required approving reviews on the default branch. 0 because agents act as adamsuk.
  approvals: 0
  # Owners written into .github/CODEOWNERS.
  codeowners:
    - "@adamsuk"
  # Required status checks. Empty by default: never invented, set per repo.
  required_checks: []

# Branch the factory pushes file changes to. It never pushes to the default branch.
sync_branch: factory/sync

# Marker that lets the factory overwrite a file. Files without it are reported as drift.
marker: factory-managed

# Where reusable workflows referenced by delivered files live.
workflows_repo: adamsuk/factory
workflows_ref: main
